name: Deploy hub to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pcr-explained/package-lock.json
      - name: Install, test and build pcr-explained
        working-directory: pcr-explained
        env:
          # The hub lives at /<repo>/ and each app at /<repo>/<app>/
          VITE_BASE: /${{ github.event.repository.name }}/pcr-explained/
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site/pcr-explained
          cp index.html site/
          cp -r pcr-explained/dist/. site/pcr-explained/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
